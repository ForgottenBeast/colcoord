[project]
name = "colcoord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "mitmproxy>=12.2.0",
    "observlib",
    "opentelemetry-instrumentation-asgi>=0.59b0",
    "opentelemetry-instrumentation-asyncio>=0.59b0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[project.scripts]
colcoord = "colcoord:__main__.run"

[tool.uv.sources]
observlib = { git = "https://github.com/ForgottenBeast/observlib.git", subdirectory = "observlib" }
